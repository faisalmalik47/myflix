name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Tag Variables
        id: vars
        run: |
          echo "commit_id=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$DOCKER_USER" ]; then
            DOCKER_USER="faisalmaliik"
          fi
          REPO="${{ secrets.DOCKERHUB_REPO }}"
          if [ -z "$REPO" ]; then
            REPO="${DOCKER_USER}/myflix"
          fi
          echo "image_name=${REPO}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image (Secure - Zero Build Secrets)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Exactly 1 image tag pushed: commit ID
          tags: ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.commit_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
